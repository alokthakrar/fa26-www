- name: Alok Thakrar
  email: aut@
  role: Head TA
  bio: "Hi! I'm Alok, a junior from Santa Barbara, CA majoring in EECS. This is my fourth semester on course staff! I love Chipotle, Ryan Gosling, chess, and making new things. I'm also excited about robotics and computer vision. In my experience, 66 taught me a lot of foundational skills that *span a wide basis* across a lot of my interests, and I hope you'll feel the same and have a lot of fun in the course. Looking forward to meeting ya'll!"
  image: AlokThakrar.png
  imageFun: AlokThakrarsilly.png
  pronouns: he/him

