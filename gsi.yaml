- name: Baris Oktay
  email: kbarisoktay@
  role: Head Lab TA
  bio: "hey guys! i'm Baris, a senior in EECS with a minor in MSE. this is my 4th semester with EECS 66, formerly 16A if some of you remember. i do research in biosensors and have worked on a bunch of things from nanofab and analog design to automation and imaging, mostly in a biomedical engineering context. in my free time, i like playing soccer, wandering around with friends, or playing online pool lol. i'll be the head lab this semester, and honestly labs are my favorite part of EECS 66, so i'm hoping to share that with y'all. excited to meet everyone and have a great semester! please don't hesitate to reach out for anything!"
  image: BarisOktay.jpg
  imageFun: BarisOktaySilly.jpeg
  pronouns: he/him/his

